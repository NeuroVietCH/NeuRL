# NeuRL minimal atlas-free NeuroVFM feature extraction config
sample_mri: data/processed/n4_hdbet_crop/ADNIDOD_0142929_MR_MT1__N3m_Br_20140918111051532_S230569_I444091.nii.gz  # ADNI-DOD DOD_1872 (CN), see data/adnidod/manifest_processed.csv
outputs_dir: outputs

neurovfm:
  repo: ext/neurovfm
  checkpoint: checkpoints/hf/mlinslab/neurovfm-encoder
  device: cuda
  modality: mri
  patch_size: [4, 16, 16]
  target_spacing: [1.0, 1.0, 4.0]  # fixed by NeuroVFM (load_image hardcodes 1x1x4mm); other values raise
  remove_background: true
  use_amp: true

# MRI cleanup before NeuroVFM (python -m neuro_evidence.preprocess, run from src/).
preprocess:
  out_dir: data/processed/n4_hdbet_crop
  orientation: RAS
  spacing: [1.0, 1.0, 1.0]
  n4:
    enabled: true
    shrink_factor: 4
    iterations: [50, 50, 30, 20]
    convergence_threshold: 1.0e-7
  skull_strip:
    method: hdbet   # hdbet | fallback (fallback = threshold mask, smoke tests only)
    device: cuda
    tta: false
