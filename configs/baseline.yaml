# NeuRL minimal atlas-free NeuroVFM feature extraction config
sample_mri: data/processed/strict/ADNIDOD_0142929_MR_MT1__N3m_Br_20140918111051532_S230569_I444091.nii.gz  # ADNI-DOD DOD_1872 (CN), see data/adnidod/manifest_processed.csv
outputs_dir: outputs

neurovfm:
  repo: ext/neurovfm
  checkpoint: checkpoints/hf/mlinslab/neurovfm-encoder
  device: cuda
  modality: mri
  patch_size: [4, 16, 16]
  target_spacing: [1.0, 1.0, 4.0]  # fixed by NeuroVFM (load_image hardcodes 1x1x4mm); other values raise
  remove_background: true
  use_amp: true
  # Token selection on full-head input. Base rule:
  #   neurovfm = NeuroVFM's released rule, also used by its training code (no voxel <= 10th percentile);
  #              lets some noisy ADNI air through, as the paper reports for its own MRI foregrounds
  #   head     = patches entirely inside our Otsu head mask <scan stem>_head.nii.gz (cleaner, not NeuroVFM's)
  token_rule: neurovfm
  # PLUS every patch whose HD-BET brain fraction is >= this value. Needs <scan stem>_mask.nii.gz
  # next to the scan (preprocess.skull_strip.method: hdbet). null = NeuroVFM's rule only.
  min_brain_fraction: null
  # Local-context encoding: split the patch grid into non-overlapping windows of [D, H, W] patches
  # (4x16x16 mm each) and run each window as its own sequence, so attention never crosses a window.
  # Positional embeddings keep absolute coords. null = whole scan in one sequence (NeuroVFM default).
  local_window: null

# MRI preparation before NeuroVFM (python -m neuro_evidence.preprocess, run from src/).
# Input: NIfTI or a DICOM series directory. Default = strict NeuroVFM pipeline: the scan is written
# unchanged (DICOM -> NIfTI) and NeuroVFM does reorientation, 1x1x4mm resampling (4mm along the
# acquisition axis), normalization and tokenization itself. Every step below is off; turn steps on
# to deviate. Previous pipeline (n4_headcrop_1mm): orientation RAS, spacing [1,1,1], n4 on, crop on.
preprocess:
  out_dir: data/processed/strict
  orientation: null    # e.g. RAS
  spacing: null        # e.g. [1.0, 1.0, 1.0]; isotropic input makes NeuroVFM slice along I-S, not the acquisition axis
  n4:
    enabled: false     # not part of NeuroVFM's pipeline; ~no-op on ADNI's N3-corrected downloads
    shrink_factor: 4
    iterations: [50, 50, 30, 20]
    convergence_threshold: 1.0e-7
  skull_strip:
    method: none       # none | hdbet (brain mask file for crop + min_brain_fraction; pixels never stripped) | fallback (smoke tests)
    device: cuda
    tta: false
  crop:
    enabled: false           # crop FOV to the brain mask (hdbet) or head mask (none) + margins
    margin_mm: 5.0           # around the mask bbox (25 with hdbet: skull + scalp)
    inferior_margin_mm: 5.0  # below the mask (40 with hdbet: brainstem/cerebellum side)
