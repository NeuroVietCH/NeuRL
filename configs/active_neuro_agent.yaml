# Minimal Active Neuroimaging Diagnostic Agent baseline.
# Paths point to the existing cached OASIS/NeuroVFM artifacts in sibling brainet.
folds_csv: ../brainet/data/postprocessed/oasis_c3/split_info/folds.csv
metadata_csv: ../brainet/data/oasis/processed_mri/oasis_neurovfm_canonical_manifest.csv
token_dir: ../brainet/data/oasis/processed/neurovfm_tokens
fold: 0
n_per_class: 4
seed: 7

environment:
  max_steps: 16
  move_penalty: -0.01
  inspect_penalty: -0.02
  useful_evidence_scale: 0.05
  correct_reward: 1.0
  incorrect_reward: -1.0

ppo:
  updates: 4
  episodes_per_update: 8
  epochs: 3
  gamma: 0.98
  clip_ratio: 0.2
  lr: 0.0003
